name: Scheduled Listing Scrape

on:
  schedule:
    # 09:00 and 21:00 Beijing time (UTC+8) = 01:00 / 13:00 UTC.
    # Twice a day keeps the Bybit "first seen" dates within half a day.
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      okx_lookback_days:
        description: 'OKX: report coins first listed within this many days (normal run 45; use 330 once to backfill to Dec 2025)'
        required: false
        default: '45'

permissions:
  contents: write  # needed to commit the updated database/CSV back to the repo

concurrency:
  group: listing-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scrape -> process -> database cycle
        env:
          OKX_LOOKBACK_DAYS: ${{ github.event.inputs.okx_lookback_days || '45' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python run_once.py

      - name: Sync new listings to Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python google_sheets_sync.py

      - name: Commit updated database and exports
        run: |
          git config user.name "listing-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add listings.db bybit_universe.json listings_export_*.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto-update: listing scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      # Fails the job (and e-mails you) when an exchange has produced nothing
      # for longer than it ever does. Runs AFTER the commit so data is never lost.
      - name: Health check
        run: python health_check.py listings.db
